[project]
name = "agent-builder-backend"
version = "0.1.0"
description = "Enterprise Agent Builder Platform with LangGraph, FastAPI, Gemini and Langfuse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.30",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langfuse>=2.50.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
